name: smart-words

services:
  service-word:
    build:
      context: ./backend/service-word
      dockerfile: Dockerfile
    container_name: smart-words-service-word
    environment:
      WORD_DATA_DIR: /app/data
    volumes:
      - ./data/service-word:/app/data
    expose:
      - "1111"
    restart: unless-stopped

  service-quiz:
    build:
      context: ./backend/service-quiz
      dockerfile: Dockerfile
    container_name: smart-words-service-quiz
    environment:
      QUIZ_DATA_DIR: /app/data
    volumes:
      - ./data/service-quiz:/app/data
    expose:
      - "2222"
    depends_on:
      service-word:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-words-frontend
    depends_on:
      service-word:
        condition: service_healthy
      service-quiz:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
