service {
  name = "QUIZ-TEST"
  host = "127.0.0.2"
  port = 3222
  idle-timeout-minutes = 12
}

cors {
  any-origin = false
  allow-credentials = true
  max-age-seconds = 60
  any-method = false
}

data {
  mode-file = "modes-test.json"
  dir = "   "
}

word-service {
  name = "WORD-TEST"
  host = "word-service-test"
  port = 4111
  base-url = "http://word-service-test:4111"
  request-timeout-seconds = 2.0
}

quiz {
  default-size = 7
  default-mode = 3
  default-language = "en"
}