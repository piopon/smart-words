name: smart-words

services:
  service-word:
    build:
      context: ./backend/service-word
      dockerfile: Dockerfile
    container_name: smart-words-service-word
    environment:
      WORD_DATA_DIR: /app/data
    volumes:
      - ./data/service-word:/app/data
    expose:
      - "1111"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1111/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  service-quiz:
    build:
      context: ./backend/service-quiz
      dockerfile: Dockerfile
    container_name: smart-words-service-quiz
    environment:
      WORD_SERVICE_HOST: service-word
      WORD_SERVICE_PORT: "1111"
      QUIZ_DATA_DIR: /app/data
    volumes:
      - ./data/service-quiz:/app/data
    expose:
      - "2222"
    depends_on:
      service-word:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2222/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-words-frontend
    depends_on:
      service-word:
        condition: service_healthy
      service-quiz:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
