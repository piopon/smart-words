name: backend status
on: 
  workflow_dispatch:
    inputs:
      run_quiz:
        description: Run quiz backend verification
        required: true
        type: boolean
        default: true
      run_word:
        description: Run word backend verification
        required: true
        type: boolean
        default: true
      run_leaderboard:
        description: Run leaderboard backend verification
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "0 20 * * 1"
jobs:
  verify-backend-quiz:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_quiz == 'true' }}
    uses: ./.github/workflows/backend-quiz.yml
    secrets: inherit
  verify-backend-word:
    uses: ./.github/workflows/backend-word.yml
    secrets: inherit
  verify-backend-leaderboard:
    uses: ./.github/workflows/backend-leaderboard.yml
    secrets: inherit
