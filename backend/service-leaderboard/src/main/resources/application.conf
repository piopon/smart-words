service {
  name = "LEADERBOARD"
  name = ${?LEADERBOARD_SERVICE_NAME}

  host = "0.0.0.0"
  host = ${?LEADERBOARD_SERVER_HOST}

  port = 3333
  port = ${?LEADERBOARD_SERVER_PORT}

  idle-timeout-minutes = 30
  idle-timeout-minutes = ${?LEADERBOARD_SERVER_IDLE_TIMEOUT_MINUTES}
}

cors {
  any-origin = true
  any-origin = ${?LEADERBOARD_CORS_ANY_ORIGIN}

  allow-credentials = true
  allow-credentials = ${?LEADERBOARD_CORS_ALLOW_CREDENTIALS}

  max-age-seconds = 86400
  max-age-seconds = ${?LEADERBOARD_CORS_MAX_AGE_SECONDS}

  any-method = true
  any-method = ${?LEADERBOARD_CORS_ANY_METHOD}
}
